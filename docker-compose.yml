version: '3.8'

services:
  nexus-portal:
    build: .
    container_name: nexus-portal
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - HF_REPO=aman29/benchmarks-eval-corpus
      - HF_TOKEN=${HF_TOKEN}
      - DUCKDB_MEMORY_LIMIT=2GB
      - DUCKDB_THREADS=4
    restart: unless-stopped
